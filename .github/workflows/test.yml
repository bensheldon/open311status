name: Test
on:
  push:
  workflow_dispatch:
jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: "Ruby: Install Ruby"
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: "Node: Setup"
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: "Node: Install dependencies"
        run: npm ci
      - name: Lint
        run: bin/lint --nofix
      - name: Run tests
        run: bin/rspec
      - name: Build website
        run: bin/parklife build
      - name: Check website build
        run: bin/check-build
      - name: Run browser tests against the build
        run: bin/rspec --tag build
