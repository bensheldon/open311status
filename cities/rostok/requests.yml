  status_notes: "[Update] Die gewünschte Querung in einem Zug ist auch unser Ziel und wird kontinuierlich im Rahmen der finanziellen und technischen Möglichkeiten umgesetzt. Eine kurzfristige Anpassung an dieser Bestandsanlage ist nicht möglich, da die Umsetzung eine umfangreiche Überarbeitung der Signalsteuerung erfordert und häufig auch bauliche Anpassungen notwendig werden. Auf Grund der neuen Bebauung und dem geänderten Mobilitätsverhalten der Bevölkerung soll dies mittelfristig erfolgen. Dabei wird auch die Querung in einem Zug geprüft. Bis zu einer solchen Lösung ermöglicht die Mittelinsel allen Personengruppen das sichere Überqueren der Straße, wobei die Signalsteuerung sicherstellt, dass die (jeweilige) Fahrbahn auch nach Grünende sicher verlassen werden kann. (PS: Das Klarschiff Portal wurde zur Bearbeitung einfacher Störungsmeldungen konzipiert und erlaubt keine Lösung städteplanerischer und verkehrsplanerischer Sachverhalte. Technisch sind uns dazu nur kurze Kommentare möglich.)"
