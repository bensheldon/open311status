  status_notes: Vielen Dank für Ihre positive Rückmeldung. Nach Betätigung eines Tasters wird die Querung in den meisten Fällen in weniger als 10 Sekunden freigegeben, manchmal dauert es bis zu 20 Sekunden und nur in seltenen Fällen ist die Wartezeit größer als 60s. Eine Auswertung der Daten hat ergeben, dass längeren Wartezeiten nur dann auftreten, wenn die Querung bereits kurz zuvor GRÜN hatte oder ein Bus die Strecke befährt. Die Steuerung reagiert in dieser Weise, weil die neue Lichtsignalanlage neben der Sicherung der Querung (diese steht an erster Stelle) auch die Priorisierung des ÖPNV und einen harmonischen Verkehrsablauf bewerkstelligen soll. Eine Anpassung der Steuerung wurde bereits geprüft, sie lässt sich unter diesen Bedingungen aber nicht wie gewünscht umsetzen.
  status: closed
  service_code: 111
  service_name: Ampelschaltung ändern
  description: "Sehr geehrte Damen und Herren, \ndas Aufstellen eines mobilen Blitzers hat sehr dazu beigetragen, den Straßenverkehr zu entschleunigen und das \"wilde\" Geparke/Halten vor den Haustüren einzudämmen. Vielen Dank dafür. Der Blitzer kann gerne häufiger dort aufgestellt werden.\n\nEine weitere Anregung ist die Schaltung der Ampel: Morgens (kurz vor 8 Uhr) sind Kinder sehr ungeduldig an der Ampel, da sie eilig zur Schule wollen. Es gab schon einige blenzlige Situationen (auch wegen zu schnellen Fahrens, aber auch wegen Überquerung der Ampel bei rot). Vielleicht kann zu der Uhrzeit die Ampelschaltung wieder geändert werden (schnelleres Umschalten).\n\nNochmals vielen Dank für Ihren Einsatz, den Straßenverkehr in Rostock sicherer zu machen.\n\nMit freundlichen Grüßen"
