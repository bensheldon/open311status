  service_name: dauerhaftes Falschparken
  description: Es kommt wiederholt vor, dass dieses Fahrzeug ordnungswidrig auf dem Gehweg abgestellt wurde. Dadurch wird der Gehweg erheblich eingeschränkt bzw. teilweise vollständig blockiert. Fußgänger, insbesondere Menschen mit Kinderwagen, Rollstuhlfahrer, Personen mit Rollatoren sowie Kinder, werden dadurch behindert und teilweise gezwungen, auf die Fahrbahn auszuweichen. Ich bitte darum, diesen wiederkehrenden Verstoß zu überprüfen und entsprechende Maßnahmen einzuleiten, damit der Gehweg wieder uneingeschränkt und sicher von allen Fußgängern genutzt werden kann.
