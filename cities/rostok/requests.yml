  service_name: bauliche Gefahrenstelle
  description: Der Radweg, immerhin Bestandteil des Radfernweg Berlin–Kopenhagen und Teil des Bundesförderprogramms „Radnetz Deutschland“ ist jetzt endlich wieder benutzbar. Eine Schande war ja bereits, daß die Zuwegung Krummendorf volle 4 Monate (.) gesperrt war, wegen der Wasser-Anschlusserneuerung von gerade mal 9 Wohneinheiten im Kirchsteig. Nun zeigen sich einige Unebenheiten und sogar Risse in der Fahrbahn. Nach gerade ein mal 2 Jahren. AKtuell (2026 Oktober/November) wurde offenbar versucht, 3 der größten Risse mit groben Split und etwas Bitumen zu schließen. Der Versuch ist völlig untauglich, da der Split zu grob ist, nicht eingearbeitet wurde und nicht mal über die volle Breite aufgefüllt wurde. Hier sollte erst mal die Bodenwelle abgefräst werden und dann mit besserer Bitumenmasse neu abgedeckt werden.
