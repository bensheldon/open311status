  address: 1122 W 11th ST
  address_id: 13169
  zipcode: '47404'
  lat: 39.17338562011719
  long: -86.54800415039062
  description: "Constructive Feedback: Balancing Tourism Investments with Neighborhood Food Access\r\n\r\nI am writing to share some respectful feedback regarding the City of Bloomington’s development priorities and how they affect everyday residents in our neighborhoods. I recognize that the city is only responsible for so much and cannot control every private business decision, so I want to share this politely. At the same time, I believe this is vital feedback that needs to be discussed frequently and openly by city leadership.\r\nWhile it can be disheartening to see public land, tax dollars, and city resources dedicated to supporting upscale boutique hotels and tourism projects, many of our lower-income neighborhoods still lack basic, walkable access to affordable groceries and consistent neighborhood upkeep.\r\nIn my own neighborhood near West 11th Street, a long-vacant building was finally remodeled and reopened as a convenience store last spring. While having an active storefront is welcome, it does not solve our neighborhood's food desert problem. The store has only a tiny grocery aisle and does not accept SNAP or food stamps, which many of my neighbors rely on to feed their families. Worse yet, almost nothing on the shelves has a price tag except for pre-priced vendor items like Pepsi and Frito-Lay products that the store does not control. Everything else is left unmarked, so shoppers do not find out until they reach the counter that the prices are so high they cannot afford them. Even when the store finally began carrying basic dairy items recently, it was simply reselling Aldi-brand products at steep markups, charging around $4 for a standard bag of shredded cheese.\r\nOn top of not serving the community's basic grocery needs, the property has become a neighborhood safety and code concern. There is a row of abandoned or inoperable cars sitting on the lot where customers are told to leave their names and numbers if they are interested in buying them, even though this is a convenience store rather than a licensed auto dealership. People are also inhabiting the spaces between and behind these parked cars, leaving piles of clothes and debris behind.\r\nRight now, if I want to buy basic staples like a gallon of milk and a can of coffee at a normal grocery store, I have to ride the Route 2 West 11th bus downtown and transfer to another line. Even during peak weekday hours when buses run every 30 minutes, that round trip takes 2 to 2.5 hours. After 6:00 p.m. on weekdays, or anytime on weekends when Route 2W drops to once-an-hour service, that same grocery trip takes 3 hours or more. Service also stops so early on evenings and Sundays that working residents can easily be stranded without a ride home. Worst of all, those estimates assume the bus is actually running on time. Multiple overlapping downtown construction projects, which often appear poorly coordinated with Bloomington Transit, frequently delay buses just enough to miss tight transfer windows at the Transit Center, adding another 30 to 60 minutes of waiting in bad weather with bags of groceries.\r\nAgain, I know the city cannot fix every issue overnight, and I appreciate the work staff and officials put into serving Bloomington. However, as the city continues to court developers and invest in downtown hospitality, I kindly urge leadership to keep these everyday realities at the forefront of ongoing conversations. I hope the city can bring that same energy, funding, and creativity to incentivizing real, affordable grocery options and basic property standards in underserved neighborhoods. Residents who live and work here year-round deserve safe streets and convenient access to reasonably priced food staples just as much as visitors deserve upscale accommodations."
