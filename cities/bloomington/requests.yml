  description: I am writing in response to this morning's Herald-Times article, and regarding allegations made by Kathryn Coers Rossman against the Bloomington Arts Commission and Bloomington’s arts scene at large. I have received several communications from Rossman via my workplace email in the past week (unaffiliated with the city), specifically targeting Indiana University employees who serve in a volunteer capacity with the BAC or otherwise engage in arts programming. In effect, she has asked the university to investigate all arts affiliated staff, particularly in the Cook Center, suggesting there is a greater conspiracy to "silence" her on the basis of her Jewish faith. I know this claim to be fundamentally untrue. Per Rossman’s requests, I reviewed CATS footage from both of last week’s city meetings and have spent considerable time attempting to make sense of her reaching, ranging claims disseminated into the community via email, as well as online via Instagram and Facebook, and now via the attention of the press. I do not believe that Rossman is acting in good faith and am concerned to learn that her husband works as a staff attorney for the city, with potential access to privileged communications regarding this matter. Further, I have become concerned for the safety and wellbeing of former city staff, Holly Warren and Chaz Mottinger, who are facing continued harassment from Rossman despite no longer being employed with the city. Screenshotted images from Warren’s personal and private Instagram account, including images of her body, have been publicized by Rossman like exhibits in an imaginary public trial that she’s executing herself, playing the role of defendant and defense counsel. She appears to be on a defamation campaign with no intention of stopping. And to me, her behavior appears to be increasingly erratic. In a letter addressed to IU President Pam Whitten, she claimed that she’s needed to take her young son out of school to console her; I am deeply concerned for the wellbeing of that young boy and ask that appropriate measures are taken to ensure his safety while she is assessed for help. Further, I write to express my deep appreciation for the BAC and its present members, as well as Christina Elem and Paige Sharp. A disbanding of the BAC, which Rossman has called for, would be severely detrimental to the public health of this community.
