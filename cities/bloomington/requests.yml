  address: City Hall, Bloomington, IN
  description: "The City of Bloomington’s uReport system is being weaponized as a tool of harassment, intimidation, and retaliation intended to silence my constitutionally protected speech. False allegations are being publicly circulated through an official municipal platform by friends of city employees to discredit me and intimidate me into silence.\r\n\r\nMy religion was publicly disclosed without my permission. I do not disclose my religion publicly. My family’s faith was then subjected to public scrutiny as though our religious identity were a matter of city business. The location of my private home was also publicly disclosed. The Monroe County Sheriff’s Office is now involved in addressing concerns for my family’s safety.\r\n\r\nThis is intimidation, not legitimate civic reporting. I allege religious discrimination, viewpoint discrimination, and First Amendment retaliation.\r\n\r\nThe City of Bloomington is responsible for how it administers its own reporting system. Its continued facilitation of a platform being used to intimidate a private citizen, expose her family, and suppress protected speech raises serious questions of municipal liability under federal civil-rights law."
