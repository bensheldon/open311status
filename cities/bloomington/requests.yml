  description: "I had an unpleasant interaction with construction workers at the intersection of Maple Street and Kirkwood Avenue. There was no visible signage indicating a road closure, detour, or required direction of travel. When I attempted to continue straight on Kirkwood, several workers began yelling and using profanity toward me, insisting that I could only travel in one direction.\r\n\r\nThere were no visible barriers preventing me from continuing straight, and the lack of signage made the traffic restrictions unclear. I found the workers’ behavior unnecessarily aggressive and unprofessional.\r\n\r\nI understand that construction requires temporary traffic restrictions, but those restrictions should be clearly communicated through proper signage, and workers should treat members of the public respectfully. I hope the City will address both the lack of traffic guidance and the conduct of the workers involved."
