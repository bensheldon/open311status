  description: "Driving down Grimes as it turns to Patterson. There are no visible traffic control signs, however, at the entrance to Catalent there is a pickup truck blocking the road with a guy telling everyone to turn around. I ask him why there is not signage he states \"Not my problem\". He has a visible walkie talkie on his vest. I tell him to inform someone there is no signage and he's closing the road. Again I'm told \"Not my problem\". Then proceed down Rogers to 2nd St, see a wall of barricades, it is not obvious there is anywhere to go so proceed to Kirkwood. Kirkwood is a 4-way stop as it has been for weeks on end. Finally am able to head west to complete my trip. \r\n\r\nHeading home the same way I see on Rogers a \"one lane ahead\" sign followed by an \"end of construction\" sign followed by a flagger sign. Obviously none of this makes sense and completely negates any signage and places the public and the construction works at unnecessary risk. The city needs to manage their project better. This is dangerous and unacceptable."
