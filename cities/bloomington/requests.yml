  description: Elletsville resident Kathryn Coers Rossman continues to publicly harass current and former city employees and volunteers with a yearlong campaign against Christina Elem, Chaz Mottinger, Holly Warren, Elliot Reichert, Nada Abdelrahim, Paige Sharp and others. She asserts discrimination against her despite a clear record of the City, ESD, and Bloomington Arts Commission supporting her artistic work over the years with grants and promotion. She has made false and defamatory statements online and in person on record at City Hall about many of the figures listed above. Recently she has begun to call for the disbanding of the art commission, which would be harmful to the cultural  community. As a member of the arts community living in Bloomington I am afraid for my safety and the safety of my community members.
