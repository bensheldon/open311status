- service_request_id: 27149-2026
  title: "#27149-2026 Wilder Müll"
  description: "Meldung über Sondernutzung des öffentlichen Raums und illegale Müllablagerung\r\n​Im Grünbereich der öffentlichen Straße ist es regelmäßig zu folgenden Missständen und Belästigungen gekommen:\r\n​Illegale Müllzwischenlagerung: Es befindet sich dort ein Müllhaufen, der im Wesentlichen aus mehreren blauen Eimern besteht, die vermutlich aus gewerblicher Tätigkeit stammen. Beobachtungen zufolge werden dieser Müll und die Eimer regelmäßig von dem an der Straße stehenden Pritschenwagen abgeladen und dort zwischengelagert.\r\n​Sondernutzung / Entzug der Allgemeinheit: Zudem wurden dort private Gartenstühle platziert, die als Absperrung für Parkplätze dienen. Dadurch wird der öffentliche Parkraum unberechtigt für die Allgemeinheit gesperrt.\r\n​Die beschriebenen Aktivitäten sowie der Missbrauch des öffentlichen Raums gehen mutmaßlich von Personen aus, die unter der Anschrift Weilerweg 91 wohnhaft sind oder sich dort regelmäßig aufhalten."
  lat: 51.02283914786
