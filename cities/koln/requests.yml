- service_request_id: 27971-2026
  title: "#27971-2026 Straßenmarkierung"
  description: "Die Fahrbahnmarkierung zur Freihaltung der Tiefgaragenein- und -ausfahrt ist mittlerweile stark verblasst und kaum noch erkennbar.\r\n\r\nRegelmäßig werden Fahrzeuge so abgestellt, dass sie deutlich in den Bereich des abgesenkten Bordsteins hineinragen. Dadurch wird nicht nur die Ein- und Ausfahrt verengt, sondern insbesondere die Sicht auf den fließenden Verkehr erheblich eingeschränkt.\r\n\r\nVon rechts kommende Fahrzeuge sind teilweise erst erkennbar, wenn man mit dem eigenen Fahrzeug bereits in den ersten Fahrstreifen hineingefahren ist. Hierdurch entsteht ein erhebliches und vermeidbares Unfallrisiko.\r\n\r\nIch bitte daher um eine zeitnahe Erneuerung der Fahrbahnmarkierung sowie um eine Überprüfung, ob deren bisheriger Umfang zur Sicherstellung ausreichender Sichtverhältnisse geeignet ist."
  lat: 50.891843204399
  long: 7.0548212528229
  address_string: 51149 Köln, Urbacher Weg 3
