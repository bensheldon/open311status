- service_request_id: 27614-2026
  title: "#27614-2026 Defekte Oberfläche"
  description: "Es wird wieder kälter und somit rutschiger: die Südbrücke ist insbes. morgens wirklich eine Zumutung. Aus der Südstadt kommend nach Poll laufend/fahrend, ist es im Winter ab ca. der Hälfte der Brücke SO glatt, dass regelmäßig Leute ausrutschen oder ins Wanken geraten. Der Bodenbelag auf der Brücke ist \"seltsam abgenutzt/glatt\", sodass (vermutlich durch den Wind) jegliche Form von (Kondenz- oder Regen-) Wasser direkt gefriert und zu einer absoluten Gefahr wird. Zudem wirkt es so, als würde nur die erste Hälfte der Südbrücke gestreut werden (oder die Streuung bleibt aufgrund der anderen Bodenbeschaffenheit Richtung Poll nicht liegen...?). \r\nIch selbst bin jung und kann mich idR abfangen bei einem Sturz, auf dem Rad hat es mich allerdings auch schon einige Male hingelegt. Für ältere Menschen ist die Überquerung der Brücke fast lebensgefährlich im Winter... Das Ausweichen auf andere Brücken ist ein extremer Umweg für alle \"Überquerer der Südbrücke\". \r\nIch bitte um eine schnelle Beseitigung dieser Umstände. Ein neuer Bodenbelag? Täglicher Streuservice am Morgen durch die Stadt? Streustationen an mehreren Stellen, dass auch als Fußgänger (nach-) gestreut werden kann? Die betroffenen Kölner würden sich sehr freuen!\r\nGerne unterstütze ich bei weiteren Ideen.\r\n\r\nBesten Dank für die Klärung des Anliegens!"
  lat: 50.91738389807
  long: 6.9744193553925
  address_string: 50679 Köln, Alfred-Schütte-Allee 24
  service_name: Defekte Oberfläche
  requested_datetime: '2026-11-24T09:25:58+01:00'
  updated_datetime: '2026-11-24T09:25:58+01:00'
  status: open
  media_url: ''
  status_note: ''
  service_code: 2.4.3
