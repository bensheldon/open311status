- service_request_id: 27850-2026
  title: "#27850-2026 Straßenbaustellen"
  description: "Defekter Aufzug an der Haltestelle Amsterdamer Straße – Linie 13\r\n\r\nSehr geehrte Damen und Herren,\r\n\r\nich möchte auf den seit mittlerweile ungefähr vier Monaten defekten Aufzug an der Haltestelle Amsterdamer Straße (Linie 13, aus Richtung Sülzgürtel) aufmerksam machen.\r\n\r\nSeit der Geburt meines Babys bin ich regelmäßig mit dem Kinderwagen unterwegs und habe dadurch immer wieder Schwierigkeiten, die Treppen ohne Aufzug zu bewältigen. Das ist nicht nur anstrengend, sondern teilweise auch sehr gefährlich.\r\n\r\nAuch für Rollstuhlfahrerinnen und Rollstuhlfahrer ist diese Situation eine große Einschränkung, da sie auf einen funktionierenden Aufzug angewiesen sind.\r\n\r\nIch möchte Sie daher herzlich bitten, sich zeitnah um die Reparatur zu kümmern. Ein funktionierender Aufzug ist für viele Menschen keine Selbstverständlichkeit, sondern eine wichtige Voraussetzung, um selbstständig am Alltag teilnehmen zu können.\r\n\r\nVielen Dank für Ihr Verständnis. Ich würde mich über eine kurze Rückmeldung sehr freuen.\r\n\r\nMit freundlichen Grüßen"
  lat: 50.970988004708
  long: 6.9691729545593
  address_string: 50735 Köln, Amsterdamer Str. 165
  service_name: Straßenbaustellen
  requested_datetime: '2026-11-26T09:15:54+01:00'
  updated_datetime: '2026-11-26T09:15:54+01:00'
  status: open
  media_url: ''
  status_note: ''
  service_code: '2.5'
