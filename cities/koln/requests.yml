- service_request_id: 27113-2026
  title: "#27113-2026 Kölner Grün"
  description: "Sehr geehrte Damen und Herren,\r\nich wende mich mit einem Anliegen an Sie, das mir als regelmäßiger Parknutzer sehr am Herzen liegt. Es geht insbesondere um die Situation in Kölner Parks: Nordpark und im Johannes Giesbert Park. \r\n\r\nDort führen seit mehreren Jahren immer mehr Hundebesitzerinnen und Hundebesitzer ihre Hunde ohne Leine. Dadurch kam es für mich und meinen Sohn bereits mehrfach zu heiklen Situationen, in denen Hunde auf uns zugerannt sind oder mich angebellt haben. \r\n\r\nHäufig waren die Halterinnen und Halter dabei abgelenkt, zum Beispiel durch den Blick aufs Handy, und konnten ihre Tiere nicht rechtzeitig zurückrufen.\r\n\r\nDas ist mir nicht nur beim Joggen passiert, sondern inzwischen auch, wenn ich mit meinem Sohn unterwegs bin oder auf einer Bank sitze. Gerade für Kinder und in der Nähe von Spielplätzen sind solche Begegnungen beängstigend und können schnell gefährlich werden. Wenn ich Hundebesitzende darauf direkt anspreche, kam bisher selten Einsicht über ihre Verantwortung. Ich wünsche mir, dass alle die Parks sicher und entspannt nutzen können.\r\n\r\nDeshalb möchte ich Sie freundlich um Folgendes bitten: Machen Sie die Hundehalterinnen und Hundehalter noch deutlicher auf ihre Verantwortung und die geltenden Regeln aufmerksam. Führen Sie in den genannten Parks mehr Kontrollen durch. Weisen Sie deutlicher darauf hin, dass es ausgewiesene Hundewiesen gibt, jedoch der Rest der Parks für alle sicher nutzbar sein sollte.\r\n\r\nIch würde mich sehr freuen, wenn Sie meine Anregungen aufgreifen. Für Rückfragen stehe ich Ihnen gern zur Verfügung.\r\n\r\nVielen Dank für Ihre Unterstützung und Ihre Arbeit!\r\n\r\nFreundliche Grüße\r\nSteffen Eggebrecht "
  lat: 50.969526412865
  long: 6.9640445709229
  address_string: 50733 Köln, Kretzerstr. 26
  service_name: Kölner Grün
  requested_datetime: '2026-11-15T11:33:23+01:00'
  updated_datetime: '2026-11-15T11:33:23+01:00'
  status: open
