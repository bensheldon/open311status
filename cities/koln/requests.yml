- service_request_id: 27777-2026
  title: "#27777-2026 Schrottfahrräder"
  description: "Meldung nicht zugelassener / schrottreifer Fahrzeuge – Flemmingstraße 3b, 50735 Köln\r\nSehr geehrte Damen und Herren,\r\n\r\nhiermit möchte ich erneut auf drei abgestellte Fahrzeuge auf dem öffentlichen Parkplatz vor der Flemmingstraße 3b, 50735 Köln, aufmerksam machen und um dringende Überprüfung sowie Entfernung bitten.\r\n\r\nEs handelt sich um folgende drei Fahrzeuge (siehe beigefügte Fotos):\r\n1. Schwarzer Ford (links): ohne Kennzeichen\r\n2. Silberner VW Lupo (Mitte): ohne Kennzeichen, deutliche Schimmel- bzw. Moosbildung\r\n3. Schwarzer Seat Leon (rechts): Kennzeichen K-FM 2009 (bitte auf Gültigkeit/Zulassung prüfen)\r\n\r\nDie Fahrzeuge stehen bereits seit vielen Monaten unbewegt an dieser Stelle. Zudem treten unter den Fahrzeugen kleine Ölflecken aus, was eine Gefahr für die Umwelt darstellt.\r\n\r\nBereits vor etwa acht Monaten habe ich den Vorfall telefonisch beim Ordnungsamt gemeldet. Vor rund zwei Monaten habe ich zudem einen Außendienstmitarbeiter des Ordnungsamtes vor Ort persönlich auf die Fahrzeuge hingewiesen. Leider ist bislang keine Abschleppung oder sichtbare Maßnahme erfolgt.\r\n\r\nDa es sich um öffentlichen Parkraum handelt, die Fahrzeuge teilweise ohne Kennzeichen abgestellt sind und Betriebsstoffe austreten, bitte ich Sie um eine zeitnahe Bearbeitung und Rückmeldung, wann mit der Entfernung der Fahrzeuge zu rechnen ist.\r\n\r\nDie entsprechenden Fotos füge ich dieser E-Mail bei.\r\n\r\nMit freundlichen Grüßen\r\n"
  lat: 50.97153575268
  long: 6.978168049276
  address_string: 50735 Köln, Flemingstr. 3
  service_name: Schrottfahrräder
  requested_datetime: '2026-11-25T14:13:14+01:00'
  updated_datetime: '2026-11-25T14:14:27+01:00'
  status: open
  media_url: https://sags-uns.stadt-koeln.de/system/files/2026-11/1000148449.jpg
