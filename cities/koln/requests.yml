- service_request_id: 28010-2026
  title: "#28010-2026 Kölner Grün"
  description: "Meldung einer illegalen Baumzerstörung / Kappung eines Straßenbaums\r\nSehr geehrte Damen und Herren,\r\nals Anwohner möchte ich eine illegale Zerstörung eines öffentlichen Straßenbaums in unserer Wohnsiedlung melden. Ein Anwohner hat den Baum am heutigen Abend ohne Genehmigung bis auf den nackten Stamm komplett gekappt. Alle Äste wurden entfernt, sodass der Baum mit hoher Wahrscheinlichkeit absterben wird.\r\nAngaben zum Vorfall:\r\n• Ort / Genaue Adresse: Rixdorfer Straße 88, 51063 Köln (auf der Straßenseite, gegenüber/abgewandt von den Hauseingängen)\r\n• Datum und Uhrzeit: Freitag, 27. November 2026, ca. 18:30–19:00 Uhr (es war bereits dunkel)\r\n• Betroffener Baum: Es handelte sich um eine ca. 25–30 Jahre alte Vogelbeere (Eberesche), die ein wichtiges Nährgehölz für die Vögel in unserer Siedlung war.\r\n• Aktueller Zustand: Es steht nur noch der nackte, abgesägte Stamm.\r\n• Täter / Verursacher: Es handelt sich um einen Anwohner mit dem Vornamen Jürgen. Er hat die abgesägten Äste zu Fuß abtransportiert.\r\n• Fahrzeug des Täters vor Ort: Vor dem Haus parkt das Fahrzeug des Verursachers, ein dunkelgrüner Kombi mit dem Kennzeichen: K-JA 2684.\r\nDa es sich hierbei um eine Straftat (gemeinschädliche Sachbeschädigung an städtischem Eigentum) sowie einen schweren Verstoß gegen die Kölner Baumschutzsatzung handelt, bitte ich Sie dringend, den Fall zu prüfen, Schadensersatz einzufordern und ein Verfahren gegen den Verursacher bzw. Fahrzeughalter einzuleiten.\r\nAus Sorge vor nachbarschaftlichen Konflikten wird diese Meldung anonym eingereicht. Die Behörden können den Schaden vor Ort an der Rixdorfer Straße 88 jederzeit unabhängig begutachten.\r\nMit freundlichen Grüßen\r\nEin aufmerksamer Anwohner"
  lat: 50.97768809107
  long: 7.0100069046021
  address_string: 51063 Köln, Rixdorfer Str. 86b
  service_name: Kölner Grün
  requested_datetime: '2026-11-27T20:13:24+01:00'
  updated_datetime: '2026-11-27T20:16:19+01:00'
  status: open
