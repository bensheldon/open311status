- service_request_id: 27121-2026
  title: "#27121-2026 Kölner Grün"
  description: "Guten Tag \r\nAm Zülpicher Platz im Innenhof meines Wohnhauses wurde am 12.11.26 aus mir unerfindlichen Gründen ein augenscheinlich gesunder gross gewachsener ca.40m hoher Baum radikal abgeschlagen!  :(\r\nGibt es dafür eine Genehmigung? \r\nIch wohne Roonstraße 17, der Baum befand sich auf dem Grundstück eines Wohnhauses auf der Hochstadenstrase, ca.Hausnummer 28, 30 oder 32.\r\nDie Innenhof dieser Gebäude grenzen aneinander, weswegen ich diesen schönen Baum auch vor meinem Fenster \"hatte\".\r\nEs gibt eh schon zu wenig Begrünung hier in der Innenstadt, das war hier jahrelang ein wenig Flora&Fauna, ein Schattenspender im Hitzesommer und Lebensraum für so viele Vögel und Tauben, ich konnte es als nächster Nähe beobachten und besitze auch Videoaufnahmen von September diesen Jahres, wo dieser Baum in seiner vollen Pracht blüht, siehe beigefügten Foto: oben Aufnahme vom 13.09.26, untere Aufnahme von heute, 15.11.26.\r\n\r\nHatte der Abholzer bzw. der Auftraggeber/Eigentümer des Hauses eine offizielle Genehmigung für diesen radikalen Abschlag?\r\nGerne würde ich diesen unglaublich brutalen Vorgang der Natur gegenüber zur Anzeige bringen!\r\n\r\nIch bitte um Stellungnahme, vielen Dank."
  lat: 50.929563383095
  long: 6.9398093223526
