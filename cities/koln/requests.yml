- service_request_id: 27679-2026
  title: "#27679-2026 Straßenbaustellen"
  description: "WG: Ihre \"Sag's uns\"-Meldung #24165-2026 wird bearbeitet\r\n\r\nViele Wochen, nachdem die Baustelle am Pingenweg zwischen Lindweiler\r\nund Heimersdorf eingerichtet wurde, habe ich mich Anfang Oktober \r\nbei Ihnen gemeldet, und bekam die. o.g. Vorgangsnummer mitgeteilt.\r\nSeit der Baustelleneinrichtung sind dort keinerlei Arbeiten durchgeführt worden.\r\nDieser Zustand hält aktuell weiter an.\r\nIch befahre diese Straße mehrmals in der Woche mit dem Fahrrad.\r\nIch kann ihnen mitteilen, dass es hier permanent zu kritischen Situationen kommt. \r\nEs handelt sich um eine Absperrung kurz vor einer Bahnunterführung.\r\nHier kommen auch sonst 2 PKW manchmal nur knapp aneinander vorbei.\r\nEin Fußweg befindet sich lediglich auf der gesperrten Seite, einen Fahrradweg\r\ngibt es nicht. Auf Grund dieser sensiblen Verkehrssituation ist meines Erachtens  eine zügige Abwicklung der Arbeiten unerlässlich. Genau das Gegenteil ist der Fall.\r\nWie lange soll dieser unhaltbare Zustand noch andauern?\r\nKann ich hierzu ihrerseits eine Rückmeldung erhalten?\r\n\r\nMit freundlichen Grüßen\r\nWolfgang Babera\r\n \r\n\r\n\r\n\r\n "
  lat: 51.001064002749
  long: 6.8964958190918
  address_string: 50767 Köln - Lindweiler, Unnauer Weg 31
  service_name: Straßenbaustellen
  requested_datetime: '2026-11-24T14:32:48+01:00'
  updated_datetime: '2026-11-24T14:39:18+01:00'
  status: open
  media_url: ''
  status_note: ''
