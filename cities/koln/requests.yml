- service_request_id: 27952-2026
  title: "#27952-2026 Schutzzeit zu kurz"
  description: "Guten Tag, ich hatte vorhin den Fall, dass ich über eine orangene Ampel gefahren bin, bei einer Geschwindigkeit von 50 km/h. Hätte ich gebremst, hätte ich stark abbremsen müssen.\r\nDie Fußgängerin wollte aber schon über die Straße gehen und hat sich tierisch aufgeregt das ich vorbei gefahren bin. Ich hatte aber DEFINITIV noch orange. Daher liegt meine Vermutung, dass die Fußgänger evtl. bereits grün haben, während die Autofahrer noch orange haben. Ich fahre seit Ewigkeiten diese Strecke und hatte das Problem noch nie, daher denke ich, bevor da ein schlimmer Unfall passiert, wäre vielleicht eine Überprüfung sinnvoll. Die Schutzphase zwischen Autofahrer orange und Fußgänger grün, sollte definitiv gegeben sein. Ich möchte nicht \"Schuld\" sein, wenn dort jemand zu Schaden kommt. \r\nVielen Dank und einen schönen Tag wünsche ich :)\r\n \r\nps: Ich denke, die Position auf der Karte müsste in etwas stimmen"
  lat: 50.924634224159
  long: 6.8802523612976
