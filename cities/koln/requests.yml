  title: "#27139-2026 Kölner Grün"
  description: "Dauerhafte Verschmutzung und Störungen im Theodor-Heuss-Park (Ebertplatz)\r\n\r\nSehr geehrte Damen und Herren,\r\nich wende mich an Sie, weil sich im Theodor-Heuss-Park am Ebertplatz seit längerer Zeit täglich Gruppen aufhalten, die den Park stark verschmutzen (Müll, Flaschen, Verpackungen, Hinterlassenschaften). \r\n\r\nAuch heute sind die Personen vor Ort (Foto - Personen Links davon). Ich bin gerade dort spazieren gegangen und konnte keine Fotos machen, da dort spezielle Gruppe, auch Dealer abhängen.\r\n\r\nDer Park und die Menschen, die ihn nutzen, leiden spürbar darunter. Viele Anwohner und Familien meiden den Park inzwischen.\r\nIch frage Sie: Warum wird hier nicht konsequent eingegriffen? \r\n\r\nDie Personen sollen den Müll selbst aufräumen und verstehen, dass das nicht geht."
