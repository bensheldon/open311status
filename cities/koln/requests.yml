- service_request_id: 28048-2026
  title: "#28048-2026 Wilder Müll"
  description: "Betreff: Illegale Elektroschrott-Ablagerung auf Gehweg / vor Hochspannungs-Verteilerkasten (Wiederholungs-Hotspot)\r\n\r\nGuten Tag,\r\nauf dem Gehweg vor der Bachemer Str. 184 wurde eine ausgebaute Einbau-Spülmaschine (mit „Zu verschenken“-Zettel) illegal abgestellt. Das Gerät ragt in den Gehweg hinein und steht direkt vor der Tür eines Hochspannungs-Verteilerkastens (RheinEnergie), sodass der Zugang im Störungsfall blockiert ist. Aufgrund der aktuellen Minusgrade dürfte das Gerät zudem durch Restwasser bereits einen Frostschaden erlitten haben.\r\nAn diesem Stromverteiler wird leider regelmäßig illegal Müll und Schrott abgelagert.\r\nBitte veranlassen Sie die zeitnahe Abholung des Elektroaltgeräts durch die AWB und prüfen Sie seitens des Ordnungsamtes eine verstärkte Beobachtung dieses Brennpunkts. Ein Foto der aktuellen Situation ist beigefügt.\r\nVielen Dank!"
