- service_request_id: 27752-2026
  title: "#27752-2026 Schutzzeit zu kurz"
  description: "Sehr geehrte Damen und Herren, \r\n\r\n​ich möchte Sie bitten, die Schaltung der neu eingerichteten Lichtsignalanlage im Bereich der Gummersbacherstr. (Ein- und Ausfahrt Parkhaus P4  auf dem Fußweg Richtung AWO Kita Deutzer Wiese) aus Gründen der Verkehrssicherheit zu überprüfen. \r\n\r\n​Hintergrund:\r\nAm 25.11.2026 gegen ca. 07:45 Uhr überquerte ich die Fahrbahn gemeinsam mit meinem vierjährigen Sohn auf dem Weg zur Kita eindeutig bei Grün. Als wir etwa die Mitte der Straße erreicht hatten, sprang die Fußgängerampel bereits auf Rot. In diesem Moment bog ein Pkw von der Gummersbacher Straße in die Einfahrt ein und fuhr hupend und ungebremst auf uns zu, sodass ich mein Kind schnell aus dem Gefahrenbereich ziehen musste. \r\n\r\nDa der Fahrer offensichtlich davon ausging, wir seien bei Rot losgelaufen, entsteht hier für mich der Eindruck, dass die Grün- bzw. Räumzeit für Fußgänger (insbesondere mit kleinen Kindern) möglicherweise sehr knapp bemessen ist oder es zu unübersichtlichen Konflikten mit abbiegenden Fahrzeugen kommt. \r\n\r\n​Da diese Strecke täglich von vielen Familien auf dem Weg zur AWO Kita Deutzer Wiese genutzt wird, besteht hier ein erhebliches Unfallrisiko für Kinder und Fußgänger. \r\n\r\n​Ich bitte Sie daher dringend um eine Überprüfung der Signalzeiten (insbesondere der Räumzeit für Fußgänger sowie der Schaltung für Abbieger). Über eine kurze Rückmeldung zum Ergebnis der Prüfung würde ich mich sehr freuen. \r\n\r\nMit freundlichen Grüßen\r\nArgiri Papadopoulou "
  lat: 50.938059665502
  long: 6.9849325140781
  address_string: 50679 Köln, Gummersbacher Str. 21
  service_name: Schutzzeit zu kurz
  requested_datetime: '2026-11-25T09:28:31+01:00'
  updated_datetime: '2026-11-25T09:28:31+01:00'
  status: open
  media_url: ''
  status_note: ''
