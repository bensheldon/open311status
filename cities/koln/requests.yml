  description: "Guten Tag!\r\nDas Verkehrszeichen „Verkehrsberuhigter Bereich“ (325.1) zu Beginn der Cilly-Servé-Str. (Einmündung Subbelrather Str.) ist nicht wahrnehmbar, da es viel zu hoch und im spitzen Winkel ausgeführt wurde! Da bereits die Straßenoptik nicht den Anforderungen an einen verkehrsberuhigten Bereich entspricht, unmittelbar auf der Straße jedoch eine Schule verortet ist, erscheint eine tatsächlich erkennbare Ausweisung als verkehrsberuhigter Bereich sehr dringend geboten.\r\nEin VZ 325.1 in Regelgröße (600x900mm) sollte daher an dem Lichtmast (siehe Foto) ausgeführt werden und nach Möglichkeit auf der linken Fahrbahnseite (ggf. dann mit der derzeit verwendeten kleinen Ausführung 420x630mm) wiederholt werden.\r\nDie erforderliche Verkehrssicherheit ist durch mangelnde Erkennbarkeit und hierdurch gänzliche Missachtung des verkehrsberuhigten Bereiches nicht gegeben. Schulweggrfahren bestehen.\r\nBitte an die Straßenverkehrsbehörde weiterleiten.\r\nDanke und ein schönes Wochenende!"
