- service_request_id: 27802-2026
  title: "#27802-2026 Straßenbaustellen"
  description: "Seit mehreren Wochen führt eine einspurige Sperrung auf der Hauptstraße in Zündorf zu massiven Verkehrsbehinderungen und Dauerstau im gesamten Ortsteil.\r\nBesonders kritisch ist die Situation für Anwohnerinnen und Anwohner sowie Fußgänger: Auf Höhe der Schmittgasse 7 weichen Linksabbieger regelmäßig auf den Gehweg aus und nutzen diesen als Abbiegespur. Das Verlassen der eigenen Haustür ist dadurch mit einer erheblichen Gefährdung verbunden.\r\nNachdem die Fahrbahn in Richtung Porz nun fertiggestellt wurde, ist unmittelbar im Anschluss die gegenüberliegende Straßenseite aufgerissen worden. Es ist absehbar, dass uns diese einseitige Verkehrsführung und die damit verbundene Gefahrenlage noch viele weitere Wochen begleiten werden.\r\nIch bitte um eine verbindliche Auskunft darüber, wie lange diese Baumaßnahme noch andauern wird und welche kurzfristigen Maßnahmen (z. B. Absperrbaken) ergriffen werden, um das Befahren des Gehwegs auf Höhe der Schmittgasse 7 sofort zu unterbinden."
