- service_code: '1.4'
  service_name: Glascontainer
  metadata: 'false'
  type: realtime
  description: "<p>Hin und wieder kann es vorkommen, dass ein Glascontainer überfüllt ist. Trotz regelmäßiger Leerung können die Wertstoffcontainer die dort abgelieferten Mengen nicht aufnehmen. Auch werden Glasabfälle nicht in die Container entsorgt, sondern unerlaubter Weise neben die Container gestellt.</p><p>Stellen Sie solche Mängel fest, dann melden Sie bitte die Standorte der Container unter Angabe der Straße mit einer Hausnummer, an denen Sie die Überfüllung der Container feststellen. Wir werden umgehend die Leerung oder die Beseitigung der beauftragen.</p>"
