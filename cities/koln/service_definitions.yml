- service_code: '1.6'
  service_name: Gully verstopft
  metadata: 'false'
  type: realtime
  description: "<p>Sie haben einen Straßengully gesehen, an dem das Wasser nicht abläuft und es kommt zu Wasserpfützen oder Überschwemmungen auf der Fahrbahn? Entweder ist der Gully verstopft oder der Anschlusskanal defekt.</p><p>Die Stadtentwässerungsbetriebe Köln, AöR (StEB), kümmern sich schnellstmöglich, in der Regel innerhalb von zwei Wochen, um die Reinigung des Gullys. In Einzelfällen kann es aufgrund besonderer Wetterlagen und der daraus folgenden Vielzahl von Meldungen zu Verzögerungen bei der Beseitigung des Schadens kommen.</p>"
