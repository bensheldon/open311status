- service_code: '2.2'
  service_name: Parkscheinautomat defekt
  metadata: 'false'
  type: realtime
  description: "<p>Sie können am Parkscheinautomat kein Parkticket ziehen? Nach dem Münzeinwurf gibt es keinen Parkschein oder keine Münzrückgabe, die EC-Karte / Geldkarte steckt im Automaten fest oder die eingeworfenen Münzen fallen durch? Bitte melden Sie uns defekte oder nicht richtig funktionierende Parkscheinautomaten.</p><p>Neben der Angabe der Straße mit einer Hausnummer, vor welcher der Automat steht, ist die Angabe der Parkscheinautomaten-Nummer sehr hilfreich.</p><p>Die Instandsetzung wird kurzfristig direkt von unserem&nbsp;Parkbetriebsservice durchgeführt.</p><p><em><strong>Was sollten Sie tun, wenn ein Parkscheinautomat defekt ist?</strong></em><br><em>Stellen Sie bitte Ihre Ankunftszeit auf einer Parkscheibe ein und legen Sie diese gut sichtbar hinter die Windschutzscheibe. Sie können dann bis zu der auf dem Parkscheinautomaten angegebenen Höchstparkdauer auch ohne Ticket parken. Sie müssen Ihr Fahrzeug nicht umparken oder an einem anderen Automaten einen weiteren Parkschein lösen.</em></p>"
  keywords: ''
  extended_attributes:
    tid: '44'
    uuid: 6b6bf332-7482-46f2-8ad2-ae4b674c48e5
