- service_code: '2.6'
  service_name: Straßenbeleuchtung
  metadata: 'false'
  type: realtime
  description: "<p>Ist eine Leuchte an einer Straße, einem Geh- oder Radweg defekt? Ist der Leuchtenmast oder das Leuchtenglas beschädigt?</p><p>Neben der Angabe der Straße mit einer Hausnummer, vor welcher die Straßenlaterne steht, ist die Angabe der <strong>Laternen-Nummer </strong>(kleines Schild auf dem Mast) sehr hilfreich.</p><p>Die Instandsetzung wird direkt vom Amt für&nbsp;Verkehrsmanagement fest beauftragt und in der Regel innerhalb von <strong>zwei Wochen </strong>durch die RheinEnergie Köln durchgeführt.</p>"
