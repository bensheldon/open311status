  description: "<p>Haben Sie ein Schlagloch entdeckt? Ist Ihnen eine defekte oder lose Gehwegplatte aufgefallen? Sind Ihnen Schäden auf einem Radweg aufgefallen?</p><p>Bitte geben Sie den Ort der Schadstelle so genau wie möglich an und nutzen Sie hierfür auch das Textfeld. Ein aussagekräftiges Foto des Schadens hilft uns bei der gezielten Bearbeitung Ihrer Meldung.</p><p>Um die Verkehrssicherheit aufrecht zu erhalten, werden alle öffentlichen Straßen, Wege und Plätze regelmäßig kontrolliert.</p><p><strong>Bitte beachten Sie:</strong> Die Beseitigung von Schadstellen wird nach der Erfassung unter Berücksichtigung der rechtlichen Rahmenbedingungen priorisiert. Hieraus ergeben sich unterschiedliche Reaktionszeiten für die zu ergreifenden Maßnahmen:</p><ul><li>Maßnahmen zur Beseitigung von Unfallgefahren im Rahmen der Verkehrssicherungspflicht</li><li>Straßeninstandsetzungs- und Straßenunterhaltungsmaßnahmen</li><li>Maßnahmen im Rahmen der Stadtbildpflege (Schönheitsreparaturen)</li></ul><p>Schäden, die eine akute Unfallgefahr darstellen, werden unmittelbar beseitigt beziehungsweise abgesichert. Bei sich entwickelnden Schäden, die unter Straßeninstandsetzungs- und -unterhaltungsmaßnahmen fallen, besteht keine unmittelbare Gefahr. Solche Schwachstellen werden verstärkt beobachtet und mittelfristig beseitigt. Schönheitsreparaturen werden umgesetzt, wenn die personellen Kapazitäten dies ermöglichen.</p><p>Wir bitten um Verständnis, dass aktuell nur Maßnahmen im Zuständigkeitsbereich des Amtes für Verkehrsmanagement abschließend bearbeitet werden können.</p><p>Gerne können Sie Straßenschäden auch telefonisch&nbsp;über die „Schlagloch-Hotline“ unter (0221) 221-38141 oder über das Bürgertelefon (0221) 221-0 melden.</p>"
  keywords: ''
  extended_attributes:
    tid: '46'
    uuid: 6e6eb546-484a-4193-99f1-7a652223777a
    revision_id: '46'
    langcode: en
    vid:
    revision_created: '1634054486'
    revision_user:
    revision_log_message:
    status: '1'
    name: Straßen-, Geh- und Radwegschäden
    description: "<p>Haben Sie ein Schlagloch entdeckt? Ist Ihnen eine defekte oder lose Gehwegplatte aufgefallen? Sind Ihnen Schäden auf einem Radweg aufgefallen?</p><p>Bitte geben Sie den Ort der Schadstelle so genau wie möglich an und nutzen Sie hierfür auch das Textfeld. Ein aussagekräftiges Foto des Schadens hilft uns bei der gezielten Bearbeitung Ihrer Meldung.</p><p>Um die Verkehrssicherheit aufrecht zu erhalten, werden alle öffentlichen Straßen, Wege und Plätze regelmäßig kontrolliert.</p><p><strong>Bitte beachten Sie:</strong> Die Beseitigung von Schadstellen wird nach der Erfassung unter Berücksichtigung der rechtlichen Rahmenbedingungen priorisiert. Hieraus ergeben sich unterschiedliche Reaktionszeiten für die zu ergreifenden Maßnahmen:</p><ul><li>Maßnahmen zur Beseitigung von Unfallgefahren im Rahmen der Verkehrssicherungspflicht</li><li>Straßeninstandsetzungs- und Straßenunterhaltungsmaßnahmen</li><li>Maßnahmen im Rahmen der Stadtbildpflege (Schönheitsreparaturen)</li></ul><p>Schäden, die eine akute Unfallgefahr darstellen, werden unmittelbar beseitigt beziehungsweise abgesichert. Bei sich entwickelnden Schäden, die unter Straßeninstandsetzungs- und -unterhaltungsmaßnahmen fallen, besteht keine unmittelbare Gefahr. Solche Schwachstellen werden verstärkt beobachtet und mittelfristig beseitigt. Schönheitsreparaturen werden umgesetzt, wenn die personellen Kapazitäten dies ermöglichen.</p><p>Wir bitten um Verständnis, dass aktuell nur Maßnahmen im Zuständigkeitsbereich des Amtes für Verkehrsmanagement abschließend bearbeitet werden können.</p><p>Gerne können Sie Straßenschäden auch telefonisch&nbsp;über die „Schlagloch-Hotline“ unter (0221) 221-38141 oder über das Bürgertelefon (0221) 221-0 melden.</p>"
