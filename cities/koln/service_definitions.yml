- service_code: '1.7'
  service_name: Sexistische Werbung
  metadata: 'false'
  type: realtime
  description: <p>Sexistische Werbung diskriminiert Menschen auf Grund ihres Geschlecht.</p><p>Oft werden Menschen – vor allem Frauen – ganz auf ihren Körper reduziert und als reines Dekorationsobjekt eingesetzt. Diese Art von Werbedarstellung setzt die Person zu einem Gegenstand herab und kann die Würde eines Menschen verletzen.</p><p>Sollten Sie sexistische Werbung in Köln entdecken, haben Sie hier die Möglichkeit, diese zu melden.<br>Werbung für Prostitution ist nicht generell verboten, muss sich aber an Richtlinien halten. Das Ordnungsamt entscheidet im Einzelfall, ob die Werbung entfernt werden kann.</p><p>Alle Informationen zur sexistischen Werbung finden Sie auf unserer Artikelseite <span>zum Thema </span><a href="https://www.stadt-koeln.de/leben-in-koeln/soziales/gleichstellung/frauenbilder-i-maennerbilder-i-koerperbilder"><span>Frauenbilder I Männerbilder I Körperbilder</span></a><span>.</span></p>
