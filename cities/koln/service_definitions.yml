- service_code: '1.5'
  service_name: Schrottfahrräder
  metadata: 'false'
  type: realtime
  description: "<p>Wenn Ihnen auf öffentlichen Flächen abgestellte Fahrräder auffallen, die aufgrund ihres Zustandes als Abfall zu bewerten sind, weil beispielsweise wesentliche Teile, wie Rahmen oder Räder fehlen, melden Sie diese bitte.</p><p>Wir nehmen Ihr Anliegen direkt in die Bearbeitung der Kommunalen Ordnungsdienste auf. Von dort wird geprüft, ob das Fahrrad sofort entsorgt werden kann, oder der Eigentümerin oder dem Eigentümer innerhalb einer gesetzlich vorgegebenen Frist die Möglichkeit gegeben werden muss, das Fahrrad selbst zu entfernen. Erst nach Ablauf der Frist&nbsp;dürfen wir&nbsp;tätig werden.</p><p>Wir bitten um Verständnis, dass die abschließende Bearbeitung aus diesem Grund nicht sofort erfolgen kann. Ihr Anliegen ist aber fest beauftragt und wird vom Kommunalen Ordnungsdienst weiter bearbeitet.</p>"
