- service_code: '3.3'
  service_name: Spiel- und Bolzplätze
  metadata: 'false'
  type: realtime
  description: "<p>Alle öffentlichen Kölner Spiel- und Bolzplätze werden regelmäßig gereinigt und kontrolliert – zur Sicherheit von Kindern, Jugendlichen und Eltern. Leider kommt es trotzdem immer wieder vor, dass Müll und Verunreinigungen auf den öffentlichen Kölner Spiel- und Bolzplätzen hinterlassen werden. Auch können Spielgeräte im Laufe der Zeit nicht mehr funktionstüchtig sein.</p><p>Sofern Ihnen solche Zustände oder Abnutzungen auffallen, melden Sie diese bitte mit der Angabe des Spiel-/Bolzplatznamens und falls vorhanden der Spielplatznummer, damit wir Ihre Mitteilung genau zuordnen können.</p><p>Grundsätzlich sollten aber die Hinweise auf den Beschilderungen der Spielplätze befolgt werden. Ihr Anliegen wird kurzfristig durch die Stadt Köln durchgeführt.</p>"
