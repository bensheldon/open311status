- service_code: '1.1'
  service_name: Wilder Müll
  metadata: 'false'
  type: realtime
  description: <p>Leider kommt es immer häufiger vor, dass Haus- und Sperrmüll und sogar gefährliche Abfälle (Schadstoffe) im Freiland, an Sammelcontainern für Glas oder Altkleider und auf öffentlichen Straßen und Plätzen achtlos abgelegt werden.</p><p>Die Beseitigung von wildem Müll ist teuer. Außerdem stellen illegale Müllablagerungen eine Ordnungswidrigkeit dar und werden je nach Schwere mit hohen Strafen geahndet.</p><p>Melden Sie bitte die Stellen unter Angabe der Straße mit einer Hausnummer, an denen wilder Müll liegt, damit der Abfall durch die Abfallwirtschaftsbetriebe Köln GmbH entfernt werden kann.</p><p><a href="https://www.awbkoeln.de/wilder-muell/"><strong>Weitere Informationen zum Thema Wilder Müll auf der Internetseite der Abfallwirtschaftsbetriebe Köln GmbH</strong></a></p>
  keywords: ''
