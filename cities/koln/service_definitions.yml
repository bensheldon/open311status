- service_code: '2.7'
  service_name: Umlaufsperren / Drängelgitter
  metadata: 'false'
  type: realtime
  description: "<p>Umlaufsperren oder Umlaufgitter (umgangssprachlich häufig auch Drängelgitter) werden als Hindernis am Ende von Wegen oder vor Bahnübergängen gesetzt, um die Verkehrsteilnehmer*innen zu bremsen und zu gewährleisten, dass sie Straßen bzw. Bahnübergänge aufmerksam und sicher überqueren können.</p><p>Grundsätzlich werden alle Umlaufsperren im Hinblick auf ihre Notwendigkeit und Verkehrssicherheit durch die Straßenverkehrsbehörde überprüft, eventueller Handlungsbedarf identifiziert und priorisiert &nbsp;Notwendige Veränderungen werden sukzessive umgesetzt.</p><p>Eine Umlaufsperre ist defekt oder bereitet aufgrund der Anordnung der baulichen Elemente Schwierigkeiten bei der Durchquerung? Bestehende Umlaufsperren sollten hinsichtlich einer alternativen Lösung überprüft werden?</p><p>Sollten Sie eine Umlaufsperre kennen, die problematisch ist, geben Sie bitte den Ort so genau wie möglich an und nutzen Sie hierfür auch das Textfeld. Ein aussagekräftiges Foto des Mangels hilft uns bei der Einschätzung der Situation und der gezielten Bearbeitung Ihrer Meldung.</p><p>Wir bitten um Verständnis, dass wir nur die Umlaufsperren überprüfen und bei Bedarf verändern können, die im Zuständigkeitsbereich der Stadt Köln liegen.</p>"
  keywords: ''
  extended_attributes:
    tid: '89'
    uuid: ab7d763c-7bad-4998-926c-4948e1ea356e
    revision_id: '89'
    langcode: en
    vid:
    revision_created: '1695376622'
    revision_user:
    revision_log_message:
    status: '1'
    name: Umlaufsperren / Drängelgitter
    description: "<p>Umlaufsperren oder Umlaufgitter (umgangssprachlich häufig auch Drängelgitter) werden als Hindernis am Ende von Wegen oder vor Bahnübergängen gesetzt, um die Verkehrsteilnehmer*innen zu bremsen und zu gewährleisten, dass sie Straßen bzw. Bahnübergänge aufmerksam und sicher überqueren können.</p><p>Grundsätzlich werden alle Umlaufsperren im Hinblick auf ihre Notwendigkeit und Verkehrssicherheit durch die Straßenverkehrsbehörde überprüft, eventueller Handlungsbedarf identifiziert und priorisiert &nbsp;Notwendige Veränderungen werden sukzessive umgesetzt.</p><p>Eine Umlaufsperre ist defekt oder bereitet aufgrund der Anordnung der baulichen Elemente Schwierigkeiten bei der Durchquerung? Bestehende Umlaufsperren sollten hinsichtlich einer alternativen Lösung überprüft werden?</p><p>Sollten Sie eine Umlaufsperre kennen, die problematisch ist, geben Sie bitte den Ort so genau wie möglich an und nutzen Sie hierfür auch das Textfeld. Ein aussagekräftiges Foto des Mangels hilft uns bei der Einschätzung der Situation und der gezielten Bearbeitung Ihrer Meldung.</p><p>Wir bitten um Verständnis, dass wir nur die Umlaufsperren überprüfen und bei Bedarf verändern können, die im Zuständigkeitsbereich der Stadt Köln liegen.</p>"
