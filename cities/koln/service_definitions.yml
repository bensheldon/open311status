- service_code: '1.2'
  service_name: Graffiti
  metadata: 'false'
  type: realtime
  description: <p>Illegale Graffiti und Farbsprühereien auf öffentlichen Gebäuden. Bitte helfen Sie uns hier mit einem Foto, um das Ausmaß einzuschätzen.&nbsp;</p><p>Leider werden immer wieder städtische Gebäude und Flächen beschmiert, wodurch der Eindruck der Verwahrlosung entstehen kann. Wenn Sie besprühte oder beschmierte Flächen auf öffentlichen Gebäuden, im öffentlichen Straßenland oder sonstigen öffentlichen Eigentum finden, melden Sie dies bitte, am besten mit einem Foto. Die KASA, "Kölner Anti Spray Aktion", kümmert sich umgehend um die Beseitigung. Zum Schutz des öffentlichen Eigentums und um Nachahmung zu verhindern stellt die KASA eine schnellstmögliche Reinigung sicher.</p><p>Bis zur vollständigen Reinigung vergehen in der Regel maximal zehn Tage. Bitte haben Sie Verständnis dafür, dass je nach Ort und Größe der Schmiererei, verwendete Farbe und Art des beschmierten Untergrundes, die Entfernung auch länger dauern kann. Ihr Anliegen ist aber fest beauftragt und wird an die Abfallwirtschaftsbetriebe Köln zur Reinigung der Fläche weitergeben.</p><p>Gleichzeitig wird Strafantrag wegen Sachbeschädigung bei der Polizei Köln gestellt.</p><p>Sollte das betroffene Objekt nicht im Zuständigkeitsbereich der Stadt Köln liegen stellt die KASA sicher das die Meldung an die tatsächlich zuständige Stelle weitergegeben wird.</p><p><a href="https://www.stadt-koeln.de/artikel/65363/index.html"><strong>Weitere Informationen zur Kölner Anti Spray Aktion (KASA)</strong></a></p>
