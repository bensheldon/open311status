- service_code: '1.3'
  service_name: Altkleidercontainer
  metadata: 'false'
  type: realtime
  description: "<p>Finden Sie auf öffentlichem Straßenland Altkleider-Container, die nicht von den Abfallwirtschaftsbetrieben Köln aufgestellt wurden und nicht gekennzeichnet sind, melden Sie bitte diese illegale Altkleidersammlung. Um sich gegen illegale, gewerbliche Sammlungen zu wehren und die gemeinnützigen Sammlungen zu schützen werden diese illegalen Container aus dem Stadtgebiet entfernt.</p><p>Aufgrund von gesetzlichen Vorgaben des Verwaltungsverfahrensgesetzes bringen wir am Container einen Hinweis an. Wir geben somit der Eigentümerin und dem Eigentümer die Möglichkeit den Container selbst zu entfernen. Erst nach Ablauf einer Frist von mindestens&nbsp;<strong>zwei Wochen</strong> beziehungsweise Klärung der Eigentümerverhältnisse dürfen wir tätig werden. Wir bitten daher um Verständnis, dass&nbsp;die illegal aufgestellten Altkleidercontainer nicht sofort entfernt werden können.</p>"
  keywords: ''
  extended_attributes:
