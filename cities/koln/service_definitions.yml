- service_code: '3.2'
  service_name: Kölner Grün
  metadata: 'false'
  type: realtime
  description: "<p>Sollten Sie feststellen, dass eine städtische Grünfläche vermüllt, das Gras vermeintlich zu hoch ist, Löcher im Rasen sind oder Sie andere Gefahrstellen erkennen, dann bitten wir um Mitteilung. Hierfür ist der genaue Standort sehr wichtig und ein Foto hilft uns, die Situation einzuschätzen. Unsere Mitarbeiterinnen und Mitarbeiter werden die Gefahrstellen so schnell wie möglich beseitigen und Pflegedefizite im Rahmen der nächsten Pflegedurchgänge beheben.</p><p>Berücksichtigen Sie bitte, dass der Pflegerhythmus von der Zweckbestimmung und der Nutzungsintensität abhängt. Zweckbestimmung kann sein: Sport und Spiel, Parkanlage oder z.B. Naturschutzgebiet.</p><p>Bitte beachten Sie ebenfalls, dass das Amt für Landschaftspflege und Grünflächen nur gärtnerisch tätig werden kann und keine Ordnungswidrigkeiten verfolgt.</p>"
  keywords: ''
  extended_attributes:
    tid: '51'
    uuid: 668dbdc4-eaa0-42fa-a1ce-c9ee95f45341
