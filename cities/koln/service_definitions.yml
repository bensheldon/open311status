- service_code: '2.5'
  service_name: Straßenbaustellen
  metadata: 'false'
  type: realtime
  description: <p>Hier können Sie aber&nbsp;alle "Probleme" mit <strong>Straßenbaustellen</strong> melden.</p><p>Teilen Sie uns mit, wenn die Baustelle&nbsp;von&nbsp;offensichtlich zu langer Dauer&nbsp;ist bis hin zu Ihrer Meinung nach zu gefährlicher Verkehrsführung. Wir interessieren uns aber auch für sogenannte "Schlafbaustellen" im Straßenbau, an denen offensichtlich nicht mehr gearbeitet wird. Möglicherweise sind auch Baustellen- oder Verkehrsschilder nach Beendigung der Straßenbaustelle nicht entfernt worden.<br>Wichtig ist nur, dass es sich um<strong> Straßenbaumaßnahmen </strong>und nicht um Hochbaumaßnahmen handelt.</p><p>Nicht immer können wir die durch die Straßenbaustelle entstehenden Unannehmlichkeiten beseitigen, aber wir nehmen uns der Sache an und werden wenn möglich Abhilfe schaffen.</p>
