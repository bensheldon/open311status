- service_code: '3.1'
  service_name: Brunnen
  metadata: 'false'
  type: realtime
  description: "<p>Ein städtischer Brunnen sprudelt trotz der Brunnensaison (01.April - 31.Oktober) nicht? Es befindet sich Müll im Brunnenbecken oder der Brunnen ist anderweitig verschmutzt oder verunreinigt? Bitte teilen Sie uns dies mit! Die Gebäudewirtschaft der Stadt Köln wird schnellstmöglich nach dem Rechten sehen. Teilen Sie uns dafür den Standort des Brunnens mit und beschreiben Sie den beobachteten Mangel möglichst genau.</p><p><strong>Bitte beachten Sie, dass städtische Zierbrunnen nicht als Trinkwasserbrunnen dienen!</strong></p>"
